<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Website</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            color: #24292e; /* GitHub dark gray */
        }
        p {
            font-size: 1.2rem;
            max-width: 600px;
            color: #555;
        }
        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2ea44f; /* GitHub green */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

    <h1>Hello, World! 🌍</h1>
    <p>Welcome to my new website, proudly hosted on GitHub Pages.</p>
    <a href="https://github.com" class="btn">Check out my GitHub</a>

</body>
</html>
